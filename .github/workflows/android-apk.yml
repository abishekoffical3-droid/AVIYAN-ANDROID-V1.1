name: Build AVIYAN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AVIYAN APK
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: aviyan-ai-main/mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Show project files
        run: |
          echo "=== AVIYAN mobile app ==="
          ls -la
          echo "=== Buildozer version ==="
          buildozer --version

      - name: Build APK
        run: |
          buildozer android debug

      - name: Find APK
        working-directory: aviyan-ai-main/mobile_app
        run: |
          echo "=== APK files ==="
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVIYAN-Android-APK
          path: aviyan-ai-main/mobile_app/bin/*.apk
          if-no-files-found: error
