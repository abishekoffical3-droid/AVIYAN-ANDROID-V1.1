name: Build AVIYAN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AVIYAN APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.34

      - name: Check mobile app
        working-directory: aviyan-ai-main/mobile_app
        run: |
          echo "=== AVIYAN mobile app ==="
          pwd
          ls -la
          echo "=== buildozer.spec ==="
          cat buildozer.spec

      - name: Build APK
        working-directory: aviyan-ai-main/mobile_app
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer android clean
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVIYAN-Android-APK
          path: aviyan-ai-main/mobile_app/bin/*.apk
          if-no-files-found: error
