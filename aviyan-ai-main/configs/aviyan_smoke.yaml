model:
  name: "AVIYAN-SMOKE"
  architecture: "decoder_only_transformer"
  vocab_size: 512
  hidden_size: 128
  num_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 2
  intermediate_size: 352
  max_position_embeddings: 64
  activation: "silu"
  normalization: "rmsnorm"
  attention_dropout: 0.0
  hidden_dropout: 0.0
  use_bias: false
  tie_word_embeddings: true
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  use_flash_attention: true

training:
  objective: "causal_language_modeling"
  precision: "bf16"
  mixed_precision: true
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  distributed_backend: "gloo"
  strategy: "ddp"
  checkpoint_sharding: true
  resume: false
  validation_interval: 1
  save_interval: 1
  log_interval: 1
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  warmup_steps: 1
  max_steps: 2
  max_grad_norm: 1.0
  seed: 42
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  train_data: "data/cleaned/smoke_train_tokens.pt"
  validation_data: "data/cleaned/smoke_val_tokens.pt"
  sequence_length: 64
  micro_batch_size: 2
  output_dir: "checkpoints/aviyan-smoke"

tokenizer:
  type: "BPE"
  vocab_size: 512
  path: "tokenizer/tokenizer.json"
