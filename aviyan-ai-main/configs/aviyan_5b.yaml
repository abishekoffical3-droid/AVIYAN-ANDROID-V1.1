model:
  name: "AVIYAN-5B"
  architecture: "decoder_only_transformer"
  vocab_size: 65536
  hidden_size: 4096
  num_layers: 28
  num_attention_heads: 32
  num_key_value_heads: 8
  intermediate_size: 11008
  max_position_embeddings: 8192
  activation: "silu"
  normalization: "rmsnorm"
  attention_dropout: 0.0
  hidden_dropout: 0.0
  use_bias: false
  tie_word_embeddings: true
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  use_flash_attention: true

training:
  objective: "causal_language_modeling"
  precision: "bf16"
  mixed_precision: true
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  distributed_backend: "nccl"
  strategy: "fsdp"
  checkpoint_sharding: true
  resume: true
  validation_interval: 250
  save_interval: 250
  log_interval: 10
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  warmup_steps: 2000
  max_steps: 100000
  max_grad_norm: 1.0
  seed: 42
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4

  train_data: "data/cleaned/train_tokens.pt"
  validation_data: "data/cleaned/val_tokens.pt"
  sequence_length: 8192
  micro_batch_size: 1
  output_dir: "checkpoints/aviyan-5b"

tokenizer:
  type: "BPE"
  vocab_size: 65536
  path: "tokenizer/tokenizer.json"

languages:
  - nepali
  - hindi
  - english
  - multilingual
  - code

special_tokens:
  pad: "<pad>"
  unk: "<unk>"
  bos: "<bos>"
  eos: "<eos>"
