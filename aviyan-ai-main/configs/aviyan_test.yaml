model:
  name: "AVIYAN-TEST"
  architecture: "decoder_only_transformer"

  vocab_size: 1000
  hidden_size: 128
  num_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 4

  intermediate_size: 352
  max_position_embeddings: 2048

  activation: "silu"
  normalization: "rmsnorm"

  attention_dropout: 0.0
  hidden_dropout: 0.0

  use_bias: false

training:
  objective: "causal_language_modeling"
  precision: "bf16"

tokenizer:
  type: "BPE"
  vocab_size: 1000

languages:
  - nepali
  - hindi
  - english

special_tokens:
  pad: "<pad>"
  unk: "<unk>"
  bos: "<bos>"
  eos: "<eos>"
