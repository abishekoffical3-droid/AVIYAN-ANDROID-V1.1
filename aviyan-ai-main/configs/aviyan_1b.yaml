model:
  name: "AVIYAN-1B"
  architecture: "decoder_only_transformer"

  vocab_size: 32768
  hidden_size: 2048
  num_layers: 18
  num_attention_heads: 16
  num_key_value_heads: 16

  intermediate_size: 5504
  max_position_embeddings: 2048

  activation: "silu"
  normalization: "rmsnorm"

  attention_dropout: 0.0
  hidden_dropout: 0.0

  use_bias: false

training:
  objective: "causal_language_modeling"
  precision: "bf16"

tokenizer:
  type: "BPE"
  vocab_size: 32768

languages:
  - nepali
  - hindi
  - english

special_tokens:
  pad: "<pad>"
  unk: "<unk>"
  bos: "<bos>"
  eos: "<eos>"
